<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table Map</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  body.idle { cursor: none; }
  #hint {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #bbb; font: 20px/1.5 system-ui, sans-serif; text-align: center; pointer-events: none;
  }
  #hint.hidden { display: none; }
  #notice {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    background: rgba(0, 0, 0, 0.82); color: #fff; border: 3px solid #f4c430; border-radius: 18px;
    padding: 24px 40px; font: 700 44px/1.3 system-ui, sans-serif; text-align: center;
    pointer-events: none; transition: opacity 0.6s;
  }
  #notice.hidden { opacity: 0; }
  #notice small { display: block; font-size: 22px; font-weight: 400; color: #ddd; margin-top: 8px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">Drag this window onto the table screen, then click anywhere to go fullscreen.</div>
<div id="notice" class="hidden"></div>
<script type="module" src="map.js"></script>
</body>
</html>
